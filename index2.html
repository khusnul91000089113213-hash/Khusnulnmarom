<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>PPG 2026 · Khusnul Marom, S.Pd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: #f4f7f6;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(16,185,129,0.06) 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(14,78,66,0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: #1e2b2a;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        :root {
            --primary-dark: #0b2f2a;
            --primary: #0e4e42;
            --emerald: #10b981;
            --emerald-soft: #d1fae5;
            --gray-soft: #eef2f1;
            --gray-border: #d9e2df;
            --text-dark: #1e2b2a;
            --text-muted: #5c6f6b;
            --white: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 12px rgba(0,20,15,0.06);
            --shadow-hover: 0 12px 28px rgba(0, 40, 30, 0.10), 0 4px 10px rgba(16,185,129,0.08);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }
        .app { display: flex; min-height: 100vh; position: relative; }

        /* ================= SIDEBAR ================= */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0b2f2a 0%, #0a2622 100%);
            color: #ecfdf5;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            transition: all 0.25s ease;
            z-index: 20;
            flex-shrink: 0;
            box-shadow: 2px 0 16px rgba(0,0,0,0.10);
            position: relative;
        }
        .sidebar::after {
            content: ''; position: absolute; top: 0; right: 0; width: 1px; height: 100%;
            background: linear-gradient(180deg, rgba(16,185,129,0.0), rgba(16,185,129,0.3), rgba(16,185,129,0.0));
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0.75rem 1.25rem 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 1rem;
        }
        .logo-img {
            background: white;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logo-img:hover { transform: scale(1.05) rotate(-2deg); box-shadow: 0 6px 18px rgba(16,185,129,0.35); }
        .logo-img img { width: 100%; height: 100%; object-fit: contain; }
        .logo-text { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; color: white; line-height: 1.2; }
        .logo-text span { font-weight: 400; color: #9ae6b4; font-size: 0.75rem; display: block; line-height: 1.3; margin-top: 2px; }

        .participant-badge {
            background: rgba(16, 185, 129, 0.10);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 10px;
            padding: 0.7rem 0.9rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            backdrop-filter: blur(4px);
            transition: background 0.25s ease, border-color 0.25s ease;
        }
        .participant-badge:hover { background: rgba(16, 185, 129, 0.18); border-color: rgba(16,185,129,0.45); }
        .participant-badge .p-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(16, 185, 129, 0.5);
            flex-shrink: 0;
            background: #1a3d36;
            transition: transform 0.25s ease;
        }
        .participant-badge:hover .p-avatar { transform: scale(1.06); }
        .participant-badge .p-info { min-width: 0; }
        .participant-badge .p-name { font-weight: 600; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .participant-badge .p-nim { font-size: 0.72rem; color: #9ae6b4; margin-top: 2px; }
        .participant-badge .p-prodi { font-size: 0.68rem; color: #6ee7b7; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .nav-menu { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; overflow-y: auto; padding-right: 4px; }
        .nav-item {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.7rem 1rem; border-radius: var(--radius-sm);
            color: #bbf7d0; font-size: 0.9rem; font-weight: 500;
            transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
            cursor: pointer;
            border: none; background: transparent; width: 100%; text-align: left;
            position: relative;
            overflow: hidden;
        }
        .nav-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--emerald);
            border-radius: 0 3px 3px 0;
            transform: scaleY(0);
            transform-origin: center;
            transition: transform 0.25s ease;
        }
        .nav-item i { width: 20px; height: 20px; stroke-width: 1.8; transition: transform 0.2s ease; }
        .nav-item:hover {
            background: rgba(16, 185, 129, 0.15);
            color: white;
            transform: translateX(3px);
        }
        .nav-item:hover i { transform: scale(1.1); }
        .nav-item.active {
            background: linear-gradient(90deg, var(--emerald) 0%, #0ea371 100%);
            color: #0b2f2a;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }
        .nav-item.active::before { transform: scaleY(1); }
        .nav-item.active i { stroke: #0b2f2a; }

        /* ================= MAIN ================= */
        .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; min-width: 0; }
        .topbar {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.9rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: 0 2px 10px rgba(0,20,15,0.03);
            flex-wrap: wrap; gap: 1rem;
            position: sticky; top: 0; z-index: 15;
            transition: box-shadow 0.3s ease;
        }
        .topbar-left { display: flex; align-items: center; gap: 1rem; }
        .menu-toggle {
            display: none; background: transparent; border: 1px solid var(--gray-border);
            border-radius: var(--radius-sm); padding: 0.5rem; cursor: pointer; color: var(--primary);
            transition: all 0.2s ease;
        }
        .menu-toggle:hover { background: var(--gray-soft); }
        .page-title { font-weight: 600; font-size: 1.15rem; color: var(--primary-dark); letter-spacing: -0.02em; }
        .user-badge {
            display: flex; align-items: center; gap: 0.6rem;
            background: var(--gray-soft); padding: 0.3rem 0.9rem 0.3rem 0.4rem;
            border-radius: 40px; font-size: 0.85rem; font-weight: 500; color: var(--primary-dark);
            transition: all 0.25s ease;
        }
        .user-badge:hover { background: #e2ece9; box-shadow: 0 2px 8px rgba(16,185,129,0.15); }
        .user-badge img { width: 30px; height: 30px; object-fit: cover; border-radius: 50%; background: #d1fae5; border: 1px solid var(--emerald); }

        .content { padding: 2rem; flex: 1; overflow-y: auto; animation: fadeSlideIn 0.4s cubic-bezier(0.22,1,0.36,1); }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .content > * { animation: fadeSlideIn 0.5s cubic-bezier(0.22,1,0.36,1) backwards; }
        .content > *:nth-child(1) { animation-delay: 0.02s; }
        .content > *:nth-child(2) { animation-delay: 0.08s; }
        .content > *:nth-child(3) { animation-delay: 0.14s; }
        .content > *:nth-child(4) { animation-delay: 0.20s; }
        .content > *:nth-child(5) { animation-delay: 0.26s; }

        /* ================= CARDS ================= */
        .card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-border);
            transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--emerald), #0ea371);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
            border-color: #c4d8d3;
        }
        .card:hover::before { transform: scaleX(1); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
        .card-title { font-weight: 600; font-size: 1rem; color: var(--primary-dark); letter-spacing: -0.01em; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 1.2rem;
            border: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute; bottom: -20px; right: -20px;
            width: 70px; height: 70px; border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.08), transparent 70%);
            transition: transform 0.4s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: var(--shadow-hover);
            border-color: rgba(16,185,129,0.4);
        }
        .stat-card:hover::after { transform: scale(1.5); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
        .stat-value { font-size: 1.9rem; font-weight: 700; color: var(--primary-dark); line-height: 1.2; transition: color 0.25s ease; }
        .stat-card:hover .stat-value { color: var(--primary); }
        .stat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

        .progress-bar-bg { background: var(--gray-soft); height: 8px; border-radius: 20px; overflow: hidden; margin: 0.75rem 0 0.25rem 0; position: relative; }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--emerald), #34d399);
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 0.9s cubic-bezier(0.22,1,0.36,1);
            position: relative;
            overflow: hidden;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shimmer 1.8s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ================= TABLE ================= */
        .table-wrapper { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--gray-border); transition: box-shadow 0.25s ease; }
        .table-wrapper:hover { box-shadow: 0 4px 14px rgba(0,20,15,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 600px; }
        th { text-align: left; padding: 0.9rem 1rem; background: #f9fbfa; font-weight: 600; color: var(--primary-dark); border-bottom: 1px solid var(--gray-border); white-space: nowrap; }
        td { padding: 0.9rem 1rem; border-bottom: 1px solid var(--gray-border); vertical-align: middle; transition: background 0.18s ease; }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.18s ease, transform 0.18s ease; }
        tbody tr:hover { background: #f6fbf9; }
        tbody tr:hover td { color: var(--primary-dark); }

        .badge { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 40px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; transition: transform 0.18s ease; }
        tr:hover .badge { transform: scale(1.04); }
        .badge-belum { background: #f1f5f9; color: #475569; }
        .badge-proses { background: #fef9c3; color: #854d0e; }
        .badge-kumpul { background: #dbeafe; color: #1e40af; }
        .badge-selesai { background: var(--emerald-soft); color: #065f46; }
        .badge-revisi { background: #fee2e2; color: #991b1b; }

        /* ================= FORM ================= */
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--primary-dark); }
        input, select, textarea {
            width: 100%; padding: 0.7rem 0.9rem; border: 1px solid var(--gray-border);
            border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 0.9rem;
            background: white; color: var(--text-dark);
            transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        input:hover, select:hover, textarea:hover { border-color: #c0d4ce; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); background: #fdfffe; }
        input:disabled, textarea:disabled, select:disabled { background: #f1f5f4; color: #6b7b77; cursor: not-allowed; }
        textarea { resize: vertical; min-height: 80px; }

        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.2rem; border-radius: var(--radius-sm);
            font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
            background: white; color: var(--primary-dark);
            border: 1px solid var(--gray-border);
            position: relative;
            overflow: hidden;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,20,15,0.08); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn-primary {
            background: linear-gradient(135deg, var(--emerald), #0ea371);
            color: #0b2f2a; border: none;
            box-shadow: 0 2px 8px rgba(16,185,129,0.25);
        }
        .btn-primary:hover { box-shadow: 0 6px 16px rgba(16,185,129,0.4); background: linear-gradient(135deg, #14c28b, #10b981); }
        .btn-outline { background: transparent; border: 1px solid var(--gray-border); }
        .btn-outline:hover { background: var(--gray-soft); border-color: #c0d4ce; }
        .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; }
        .btn-icon {
            padding: 0.4rem; border-radius: var(--radius-sm);
            background: transparent; border: none; cursor: pointer; color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .btn-icon:hover { background: var(--gray-soft); color: var(--primary-dark); transform: scale(1.1); }
        .btn-icon:active { transform: scale(0.95); }

        /* ================= LOCK NOTICE ================= */
        .lock-notice {
            display: flex; align-items: center; gap: 0.75rem;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 1px solid #fde68a;
            border-radius: var(--radius-md); padding: 0.85rem 1rem;
            margin-bottom: 1.25rem; color: #92400e; font-size: 0.88rem;
            transition: all 0.25s ease;
        }
        .lock-notice:hover { box-shadow: 0 4px 12px rgba(245,158,11,0.15); }
        .lock-notice i { flex-shrink: 0; }
        .lock-notice .btn { margin-left: auto; background: linear-gradient(135deg, #f59e0b, #d97706); color: #1f1300; border: none; }
        .lock-notice .btn:hover { background: linear-gradient(135deg, #fbbf24, #f59e0b); }

        /* ================= UTIL ================= */
        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.85rem; }
        .empty-state { padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; background: #fafcfb; border-radius: var(--radius-md); border: 1px dashed var(--gray-border); }

        /* ================= TOAST ================= */
        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 9999; max-width: 340px; }
        .toast {
            background: linear-gradient(135deg, #0b2f2a, #0e4e42); color: white; padding: 0.9rem 1.2rem;
            border-radius: var(--radius-md); box-shadow: 0 8px 24px rgba(0,20,15,0.2); font-size: 0.9rem;
            display: flex; align-items: center; gap: 0.6rem;
            animation: toastIn 0.35s cubic-bezier(0.22,1,0.36,1);
            border-left: 4px solid var(--emerald);
        }
        .toast-error { border-left-color: #ef4444; background: linear-gradient(135deg, #2a1a1a, #3b2020); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px) scale(0.95); } to { opacity: 1; transform: translateX(0) scale(1); } }

        /* ================= MODAL ================= */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 20, 15, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 1rem;
            animation: overlayIn 0.22s ease;
        }
        @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: white; border-radius: var(--radius-lg); padding: 2rem;
            max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0,0,0,0.25);
            animation: modalIn 0.32s cubic-bezier(0.22,1,0.36,1);
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }

        /* ================= COVER PORTFOLIO ================= */
        .cover-portfolio {
            background: linear-gradient(135deg, #0b2f2a 0%, #0e4e42 60%, #0e5a4c 100%);
            background-size: 200% 200%;
            animation: gradientShift 12s ease infinite;
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            color: white;
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0,40,30,0.2);
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .cover-portfolio::before {
            content: ''; position: absolute; top: -50%; right: -20%;
            width: 300px; height: 300px; border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            animation: floatBlob 8s ease-in-out infinite;
        }
        @keyframes floatBlob {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-20px, 20px) scale(1.1); }
        }
        .cover-logo-wrap {
            display: flex; align-items: center; justify-content: center; gap: 1.5rem;
            margin-bottom: 1rem; position: relative; z-index: 1;
        }
        .cover-portfolio img.cover-logo {
            width: 72px; height: 72px; object-fit: contain;
            background: white; border-radius: 16px; padding: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        .cover-portfolio img.cover-logo:hover { transform: rotate(-4deg) scale(1.05); }
        .cover-portfolio img.cover-photo {
            width: 72px; height: 72px; object-fit: cover;
            border-radius: 50%; border: 3px solid var(--emerald);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        .cover-portfolio img.cover-photo:hover { transform: scale(1.06); }
        .cover-portfolio h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; position: relative; z-index: 1; }
        .cover-portfolio p { color: #9ae6b4; font-size: 0.9rem; position: relative; z-index: 1; }
        .cover-portfolio .cover-meta { margin-top: 1rem; font-size: 0.85rem; color: #d1fae5; position: relative; z-index: 1; }

        /* ================= AVATAR DASHBOARD ================= */
        .dash-avatar {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--emerald); background: #1a3d36; flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .dash-avatar:hover { transform: scale(1.08); box-shadow: 0 4px 14px rgba(16,185,129,0.4); }

        /* ================= DRIVE LINK CARD ================= */
        .drive-link-card {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border: 1px solid #bae6fd;
            border-radius: var(--radius-md);
            padding: 0.9rem 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            transition: all 0.25s ease;
        }
        .drive-link-card:hover { box-shadow: 0 6px 18px rgba(14,165,233,0.12); border-color: #7dd3fc; }
        .drive-link-card .drive-icon {
            width: 36px; height: 36px; background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }
        .drive-link-card:hover .drive-icon { transform: rotate(-6deg) scale(1.05); }
        .drive-link-card a { color: #0369a1; font-weight: 600; word-break: break-all; }

        /* ================= PORTOFOLIO PENDIDIKAN ================= */
        .motto-card {
            background: linear-gradient(135deg, #0b2f2a 0%, #0e4e42 100%);
            background-size: 180% 180%;
            animation: gradientShift 14s ease infinite;
            color: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .motto-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,40,30,0.15); }
        .motto-card::before {
            content: ''; position: absolute; top: -40%; right: -10%;
            width: 220px; height: 220px; border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            animation: floatBlob 10s ease-in-out infinite;
        }
        .motto-card .motto-label {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: #9ae6b4; font-weight: 600; margin-bottom: 0.5rem;
            position: relative; z-index: 1;
        }
        .motto-card .motto-title {
            font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em;
            position: relative; z-index: 1; margin-bottom: 0.75rem;
        }
        .motto-card .motto-title em {
            font-style: italic; color: var(--emerald);
        }
        .motto-card .motto-desc {
            font-size: 0.95rem; color: #d1fae5; line-height: 1.6;
            position: relative; z-index: 1; max-width: 640px;
        }
        .motto-points {
            display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 1rem;
            position: relative; z-index: 1;
        }
        .motto-points .mp-item {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 10px;
            padding: 0.7rem 1rem;
            min-width: 160px;
            transition: all 0.25s ease;
        }
        .motto-points .mp-item:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--emerald);
            transform: translateY(-2px);
        }
        .motto-points .mp-item .mp-word {
            font-weight: 700; color: var(--emerald); font-size: 0.95rem;
        }
        .motto-points .mp-item .mp-mean {
            font-size: 0.82rem; color: #d1fae5; margin-top: 1px;
        }

        .school-card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-border);
            padding: 1.75rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
        }
        .school-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: #c4d8d3; }
        .school-header {
            display: flex; align-items: center; gap: 1rem;
            padding-bottom: 1rem; border-bottom: 1px solid var(--gray-border); margin-bottom: 1.25rem;
        }
        .school-header .school-icon {
            width: 48px; height: 48px; background: linear-gradient(135deg, var(--emerald-soft), #a7f3d0);
            color: #065f46; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: transform 0.25s ease;
        }
        .school-card:hover .school-icon { transform: rotate(-6deg) scale(1.05); }
        .school-header h3 { font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); letter-spacing: -0.01em; }
        .school-header .school-sub { font-size: 0.82rem; color: var(--text-muted); }

        .vm-block { margin-bottom: 1.25rem; }
        .vm-block:last-child { margin-bottom: 0; }
        .vm-block .vm-title {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--primary); margin-bottom: 0.6rem;
        }
        .vm-block .vm-title i { width: 16px; height: 16px; }
        .vm-block p {
            font-size: 0.92rem; color: var(--text-dark); line-height: 1.65;
            padding-left: 1.5rem;
        }
        .vm-block ol, .vm-block ul {
            padding-left: 1.5rem; font-size: 0.92rem; line-height: 1.7; color: var(--text-dark);
        }
        .vm-block ol li, .vm-block ul li { margin-bottom: 0.35rem; }
        .tagline-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--emerald-soft), #a7f3d0);
            color: #065f46;
            font-weight: 700; font-size: 0.9rem;
            padding: 0.45rem 1rem; border-radius: 40px;
            letter-spacing: 0.01em;
            margin-bottom: 1rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .tagline-badge:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,185,129,0.25); }

        /* ================= DATA PERANGKAT AJAR ================= */
        .perangkat-section {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-border);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.28s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
        }
        .perangkat-section::before {
            content: '';
            position: absolute; top: 0; left: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--emerald), #0ea371);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.35s ease;
        }
        .perangkat-section:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: #c4d8d3; }
        .perangkat-section:hover::before { transform: scaleY(1); }
        .perangkat-section-header {
            display: flex; align-items: center; gap: 0.75rem;
            padding-bottom: 0.9rem; border-bottom: 1px solid var(--gray-border); margin-bottom: 1rem;
        }
        .perangkat-section-header .ps-num {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), #0ea371);
            color: #0b2f2a;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
            transition: transform 0.25s ease;
            box-shadow: 0 3px 8px rgba(16,185,129,0.25);
        }
        .perangkat-section:hover .ps-num { transform: rotate(-8deg) scale(1.08); }
        .perangkat-section-header h3 {
            font-size: 1rem; font-weight: 700; color: var(--primary-dark); letter-spacing: -0.01em;
            line-height: 1.3;
        }
        .perangkat-list { list-style: none; padding: 0; margin: 0; }
        .perangkat-list li {
            padding: 0.6rem 0 0.6rem 1.25rem;
            position: relative;
            font-size: 0.9rem;
            line-height: 1.55;
            color: var(--text-dark);
            border-bottom: 1px solid #f1f5f4;
            transition: all 0.2s ease;
        }
        .perangkat-list li:last-child { border-bottom: none; }
        .perangkat-list li::before {
            content: ''; position: absolute; left: 0; top: 1rem;
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--emerald);
            transition: all 0.2s ease;
        }
        .perangkat-list li:hover { color: var(--primary); padding-left: 1.5rem; background: #f9fdfb; }
        .perangkat-list li:hover::before { width: 8px; height: 8px; top: 0.95rem; }
        .perangkat-list li strong { color: var(--primary); }

        /* ================= DAFTAR TUGAS (MODUL) ================= */
        .modul-banner {
            background: linear-gradient(135deg, #0b2f2a 0%, #0e4e42 100%);
            color: white;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,40,30,0.15);
        }
        .modul-banner::before {
            content: ''; position: absolute; top: -40%; right: -10%;
            width: 240px; height: 240px; border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            animation: floatBlob 10s ease-in-out infinite;
        }
        .modul-banner h2 {
            font-size: 1.15rem; font-weight: 700; margin-bottom: 0.35rem;
            position: relative; z-index: 1;
        }
        .modul-banner p {
            font-size: 0.88rem; color: #9ae6b4; position: relative; z-index: 1;
        }
        .modul-chips {
            display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.9rem;
            position: relative; z-index: 1;
        }
        .modul-chip {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(16,185,129,0.4);
            color: #d1fae5;
            padding: 0.35rem 0.8rem;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 500;
            transition: all 0.22s ease;
        }
        .modul-chip:hover { background: rgba(16,185,129,0.25); color: white; transform: translateY(-1px); }

        .fase-badge {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            font-weight: 700; font-size: 0.78rem;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            margin-bottom: 0.75rem;
        }
        .fase-badge.phase-2 {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            color: #1e40af;
        }

        /* ================= SCROLLBAR ================= */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--gray-soft); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #10b981, #0ea371); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0b8f64; }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 820px) {
            .sidebar { position: fixed; left: -280px; height: 100vh; top: 0; transition: left 0.3s cubic-bezier(0.4,0,0.2,1); }
            .sidebar.open { left: 0; box-shadow: 6px 0 24px rgba(0,0,0,0.2); }
            .menu-toggle { display: block; }
            .content { padding: 1.25rem; }
            .topbar { padding: 0.9rem 1.25rem; }
            .motto-points { flex-direction: column; gap: 0.5rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ================= PRINT ================= */
        @media print {
            .sidebar, .topbar, .btn, .btn-icon, .toast-container, .modal-overlay, .lock-notice { display: none !important; }
            .main { display: block; }
            .content { padding: 0.5in; animation: none; }
            .content > * { animation: none; }
            .card, .school-card, .perangkat-section { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; transform: none !important; }
            .card::before, .perangkat-section::before, .stat-card::after { display: none; }
            body { background: white; }
            .cover-portfolio, .motto-card, .modul-banner { background: white !important; color: black !important; border: 2px solid #0b2f2a; animation: none; }
            .cover-portfolio::before, .motto-card::before, .modul-banner::before { display: none; }
            .cover-portfolio p, .cover-portfolio .cover-meta, .motto-card .motto-desc, .motto-card .motto-label, .motto-card .motto-title em { color: #333 !important; }
            .motto-points .mp-item { background: #f5f5f5 !important; border: 1px solid #ccc !important; }
            .motto-points .mp-item .mp-word, .motto-points .mp-item .mp-mean { color: #0b2f2a !important; }
            .modul-banner p, .modul-chip { color: #333 !important; background: #f5f5f5 !important; border-color: #ccc !important; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo-img">
                <img src="https://i.ibb.co.com/zVpCShzk/UNJ89.png" alt="UNJ Logo">
            </div>
            <div class="logo-text">PPG 2026<br><span>Digital Portfolio</span></div>
        </div>

        <div class="participant-badge">
            <img src="https://i.ibb.co.com/JWxsbMSv/marom.png" alt="Foto Khusnul Marom" class="p-avatar" id="sidebarAvatar">
            <div class="p-info">
                <div class="p-name" id="sidebarName">Khusnul Marom, S.Pd</div>
                <div class="p-nim" id="sidebarNim">NIM 201272620022</div>
                <div class="p-prodi" id="sidebarProdi">Pend. Olahraga & Kesehatan</div>
            </div>
        </div>

        <nav class="nav-menu" id="navMenu">
            <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</button>
            <button class="nav-item" data-page="profile"><i data-lucide="user"></i> Profil Peserta</button>
            <button class="nav-item" data-page="tasks"><i data-lucide="clipboard-list"></i> Daftar Tugas</button>
            <button class="nav-item" data-page="perangkat"><i data-lucide="book-open"></i> Data Perangkat Ajar</button>
            <button class="nav-item" data-page="docs"><i data-lucide="image"></i> Dokumentasi</button>
            <button class="nav-item" data-page="activities"><i data-lucide="calendar-check"></i> Aktivitas PPG</button>
            <button class="nav-item" data-page="reflections"><i data-lucide="notebook-pen"></i> Refleksi</button>
            <button class="nav-item" data-page="reports"><i data-lucide="file-text"></i> Laporan</button>
            <button class="nav-item" data-page="portfolio"><i data-lucide="school"></i> Portofolio Pendidikan</button>
        </nav>
    </aside>

    <!-- MAIN -->
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
                <span class="page-title" id="pageTitle">Dashboard</span>
            </div>
            <div class="user-badge">
                <img src="https://i.ibb.co.com/JWxsbMSv/marom.png" alt="Foto Profil" id="topbarAvatar">
                <span id="topbarUserName">Khusnul Marom, S.Pd</span>
            </div>
        </header>
        <div class="content" id="contentArea"></div>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
    // ============ STATE ============
    const STORAGE_KEY = 'ppg2026_khusnul_portfolio';
    const DEFAULT_NAME = 'Khusnul Marom, S.Pd';
    const DEFAULT_NIM = '201272620022';
    const DEFAULT_PRODI = 'Pendidikan Olahraga dan Kesehatan';
    const DEFAULT_PHOTO = 'https://i.ibb.co.com/JWxsbMSv/marom.png';
    const UNJ_LOGO = 'https://i.ibb.co.com/zVpCShzk/UNJ89.png';
    const DOC_DRIVE_FOLDER = 'https://drive.google.com/drive/folders/18HUDe_upGpBHY3IMCCtWm7VHKEpntQhh?usp=sharing';
    const TASK_DRIVE_FOLDER = 'https://drive.google.com/drive/folders/1JVRO58Y8DkahIXvdjwZbEcGyVRKj_Aek?usp=sharing';
    const PERANGKAT_DRIVE_FOLDER = 'https://drive.google.com/drive/folders/1G754OPZUZpgxTXjFH71Lcl0Jmpm80hP5?usp=sharing';

    // ===== KUNCI EDIT PROFIL =====
    const PROFILE_EDIT_KEY = 'marom567';
    let profileUnlocked = false;

    let appData = {
        profile: {
            name: DEFAULT_NAME,
            nomorPeserta: DEFAULT_NIM,
            universitas: 'Universitas Negeri Jakarta',
            bidangStudi: DEFAULT_PRODI,
            tahun: '2026',
            dosenPenguji: '',
            foto: DEFAULT_PHOTO
        },
        tasks: [], docs: [], activities: [], reflections: []
    };

    // ============ UTILITIES ============
    function saveData() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }
        catch (e) { showToast('Gagal menyimpan data: ' + e.message, 'error'); }
    }

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                appData = { ...appData, ...parsed };
                if (!appData.profile) appData.profile = {};
                if (!appData.profile.name) appData.profile.name = DEFAULT_NAME;
                if (!appData.profile.nomorPeserta) appData.profile.nomorPeserta = DEFAULT_NIM;
                if (!appData.profile.universitas) appData.profile.universitas = 'Universitas Negeri Jakarta';
                if (!appData.profile.bidangStudi) appData.profile.bidangStudi = DEFAULT_PRODI;
                if (!appData.profile.foto) appData.profile.foto = DEFAULT_PHOTO;
                if (!appData.tasks) appData.tasks = [];
                if (!appData.docs) appData.docs = [];
                if (!appData.activities) appData.activities = [];
                if (!appData.reflections) appData.reflections = [];
            } catch (e) { showToast('Data rusak, memuat data awal.', 'error'); }
        }
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast' + (type === 'error' ? ' toast-error' : '');
        toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" style="width:18px;height:18px;"></i> ${message}`;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(40px)';
            toast.style.transition = 'all 0.25s ease';
            setTimeout(() => toast.remove(), 250);
        }, 3200);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        } catch { return dateStr; }
    }

    function escapeHtml(str) {
        if (str === undefined || str === null) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    // ============ NAVIGATION ============
    let currentPage = 'dashboard';
    const pageTitles = {
        dashboard: 'Dashboard', profile: 'Profil Peserta', tasks: 'Daftar Tugas',
        perangkat: 'Data Perangkat Ajar',
        docs: 'Dokumentasi', activities: 'Aktivitas PPG', reflections: 'Refleksi Pembelajaran',
        reports: 'Laporan', portfolio: 'Portofolio Pendidikan'
    };

    function navigateTo(page) {
        currentPage = page;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const activeNav = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (activeNav) activeNav.classList.add('active');
        document.getElementById('pageTitle').textContent = pageTitles[page] || page;
        renderPage(page);
        if (window.innerWidth <= 820) document.getElementById('sidebar').classList.remove('open');
    }

    // ============ RENDER PAGES ============
    function renderPage(page) {
        const area = document.getElementById('contentArea');
        switch (page) {
            case 'dashboard': area.innerHTML = renderDashboard(); break;
            case 'profile': area.innerHTML = renderProfile(); break;
            case 'tasks': area.innerHTML = renderTasks(); break;
            case 'perangkat': area.innerHTML = renderPerangkat(); break;
            case 'docs': area.innerHTML = renderDocs(); break;
            case 'activities': area.innerHTML = renderActivities(); break;
            case 'reflections': area.innerHTML = renderReflections(); break;
            case 'reports': area.innerHTML = renderReports(); break;
            case 'portfolio': area.innerHTML = renderPortfolio(); break;
            default: area.innerHTML = renderDashboard();
        }
        lucide.createIcons();
        attachPageEvents(page);
        const p = appData.profile;
        document.getElementById('topbarUserName').textContent = p.name || DEFAULT_NAME;
        document.getElementById('sidebarName').textContent = p.name || DEFAULT_NAME;
        document.getElementById('sidebarNim').textContent = 'NIM ' + (p.nomorPeserta || DEFAULT_NIM);
        document.getElementById('sidebarProdi').textContent = p.bidangStudi || DEFAULT_PRODI;
        if (p.foto) {
            document.getElementById('sidebarAvatar').src = p.foto;
            document.getElementById('topbarAvatar').src = p.foto;
        }
        requestAnimationFrame(() => {
            document.querySelectorAll('.progress-bar-fill[data-target]').forEach(bar => {
                const target = bar.getAttribute('data-target');
                setTimeout(() => { bar.style.width = target + '%'; }, 80);
            });
        });
    }

    // ---------- DASHBOARD ----------
    function renderDashboard() {
        const tasks = appData.tasks;
        const total = tasks.length;
        const done = tasks.filter(t => t.status === 'Selesai').length;
        const inProgress = tasks.filter(t => t.status === 'Sedang dikerjakan').length;
        const notDone = tasks.filter(t => t.status === 'Belum dikerjakan').length;
        const submitted = tasks.filter(t => t.status === 'Sudah dikumpulkan').length;
        const needRevision = tasks.filter(t => t.status === 'Perlu revisi').length;
        const progress = total > 0 ? Math.round(((done + submitted) / total) * 100) : 0;

        const recentActivities = [...appData.activities].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
        const pendingTasks = tasks.filter(t => t.status !== 'Selesai' && t.status !== 'Sudah dikumpulkan').slice(0, 5);

        const p = appData.profile;
        const photo = p.foto || DEFAULT_PHOTO;
        return `
            <div class="card mb-4" style="padding:1.25rem;background:linear-gradient(135deg,#0b2f2a 0%,#0e4e42 100%);color:white;border:none;">
                <div class="flex-between">
                    <div style="display:flex;align-items:center;gap:1rem;">
                        <img src="${escapeHtml(photo)}" alt="Foto" class="dash-avatar" onerror="this.src='${DEFAULT_PHOTO}'">
                        <div>
                            <div style="font-weight:700;font-size:1.15rem;">${escapeHtml(p.name) || DEFAULT_NAME}</div>
                            <div style="font-size:0.85rem;color:#9ae6b4;">NIM ${escapeHtml(p.nomorPeserta) || DEFAULT_NIM} · ${escapeHtml(p.bidangStudi) || DEFAULT_PRODI}</div>

    function statusBadgeClass(status) {
        if (!status) return 'belum';
        if (status === 'Belum dikerjakan') return 'belum';
        if (status === 'Sedang dikerjakan') return 'proses';
        if (status === 'Sudah dikumpulkan') return 'kumpul';
        if (status === 'Selesai') return 'selesai';
        if (status === 'Perlu revisi') return 'revisi';
        return 'belum';
    }

    // ============ PAGE EVENTS ============
    function attachPageEvents(page) {
        if (page === 'profile') {
            document.getElementById('unlockBtn')?.addEventListener('click', function() { openUnlockModal(); });
            document.getElementById('lockAgainBtn')?.addEventListener('click', function() {
                profileUnlocked = false;
                showToast('Profil dikunci kembali.');
                renderPage('profile');
            });
            document.getElementById('profileForm')?.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!profileUnlocked) {
                    showToast('Profil terkunci. Buka kunci terlebih dahulu.', 'error');
                    return;
                }
                appData.profile = {
                    name: document.getElementById('pfName').value.trim() || DEFAULT_NAME,
                    nomorPeserta: document.getElementById('pfNomor').value.trim() || DEFAULT_NIM,
                    universitas: document.getElementById('pfUniv').value.trim(),
                    bidangStudi: document.getElementById('pfBidang').value.trim() || DEFAULT_PRODI,
                    tahun: document.getElementById('pfTahun').value.trim(),
                    dosenPenguji: document.getElementById('pfDosen').value.trim(),
                    foto: document.getElementById('pfFoto').value.trim() || DEFAULT_PHOTO
                };
                saveData();
                showToast('Profil disimpan');
                renderPage('profile');
            });
        }

        if (page === 'tasks') {
            document.getElementById('addTaskBtn')?.addEventListener('click', () => openTaskModal());
            document.querySelectorAll('.edit-task').forEach(btn => {
                btn.addEventListener('click', function() { openTaskModal(parseInt(this.dataset.idx)); });
            });
            document.querySelectorAll('.delete-task').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    if (confirm('Hapus tugas ini?')) {
                        appData.tasks.splice(idx, 1);
                        saveData();
                        showToast('Tugas dihapus');
                        renderPage('tasks');
                    }
                });
            });
        }

        if (page === 'docs') {
            document.getElementById('addDocBtn')?.addEventListener('click', () => openDocModal());
            document.querySelectorAll('.delete-doc').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    if (confirm('Hapus dokumentasi?')) {
                        appData.docs.splice(idx, 1);
                        saveData();
                        showToast('Dokumentasi dihapus');
                        renderPage('docs');
                    }
                });
            });
        }

        if (page === 'activities') {
            document.getElementById('addActivityBtn')?.addEventListener('click', () => openActivityModal());
            document.querySelectorAll('.delete-activity').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    if (confirm('Hapus aktivitas?')) {
                        appData.activities.splice(idx, 1);
                        saveData();
                        showToast('Aktivitas dihapus');
                        renderPage('activities');
                    }
                });
            });
        }

        if (page === 'reflections') {
            document.getElementById('addReflectionBtn')?.addEventListener('click', () => openReflectionModal());
            document.querySelectorAll('.delete-reflection').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    if (confirm('Hapus refleksi?')) {
                        appData.reflections.splice(idx, 1);
                        saveData();
                        showToast('Refleksi dihapus');
                        renderPage('reflections');
                    }
                });
            });
        }
    }

    // ============ MODAL KUNCI ============
    function openUnlockModal() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal" style="max-width:400px;">
                <div class="modal-header">
                    <h3 style="font-size:1.05rem;"><i data-lucide="lock" style="width:18px;height:18px;vertical-align:middle;margin-right:4px;"></i> Buka Kunci Profil</h3>
                    <button class="btn-icon" id="closeModal"><i data-lucide="x"></i></button>
                </div>
                <p class="text-sm text-muted mb-3">Masukkan kunci untuk membuka akses edit profil.</p>
                <form id="unlockForm">
                    <div class="form-group">
                        <label>Kunci</label>
                        <input type="password" id="unlockKey" placeholder="Masukkan kunci..." autocomplete="off" required>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary"><i data-lucide="unlock"></i> Buka</button>
                        <button type="button" class="btn" id="cancelUnlock">Batal</button>
                    </div>
                </form>
            </div>
        `;
        document.body.appendChild(modal);
        lucide.createIcons();
        const close = () => modal.remove();
        modal.querySelector('#closeModal').addEventListener('click', close);
        modal.querySelector('#cancelUnlock').addEventListener('click', close);
        modal.querySelector('#unlockForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const key = document.getElementById('unlockKey').value;
            if (key === PROFILE_EDIT_KEY) {
                profileUnlocked = true;
                close();
                showToast('Profil terbuka. Silakan edit.');
                renderPage('profile');
            } else {
                showToast('Kunci salah. Coba lagi.', 'error');
                document.getElementById('unlockKey').value = '';
                document.getElementById('unlockKey').focus();
            }
        });
        setTimeout(() => document.getElementById('unlockKey')?.focus(), 100);
    }

    // ============ MODALS ============
    function openTaskModal(editIdx = -1) {
        const isEdit = editIdx >= 0;
        const task = isEdit ? appData.tasks[editIdx] : { title:'', category:'', modul:'', desc:'', date:'', status:'Belum dikerjakan', result:'', notes:'', driveLink:'', resultLink:'', ket:'' };
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal">
                <div class="modal-header"><h3>${isEdit ? 'Edit' : 'Tambah'} Tugas</h3><button class="btn-icon" id="closeModal"><i data-lucide="x"></i></button></div>
                <form id="taskForm">
                    <div class="form-group"><label>Judul</label><input id="tTitle" value="${escapeHtml(task.title)}" required></div>
                    <div class="form-group"><label>Kategori</label><input id="tCategory" value="${escapeHtml(task.category)}"></div>
                    <div class="form-group"><label>Modul</label><input id="tModul" value="${escapeHtml(task.modul)}"></div>
                    <div class="form-group"><label>Deskripsi</label><textarea id="tDesc">${escapeHtml(task.desc)}</textarea></div>
                    <div class="form-group"><label>Tanggal</label><input type="date" id="tDate" value="${task.date || ''}"></div>
                    <div class="form-group"><label>Status</label><select id="tStatus">
                        <option ${task.status==='Belum dikerjakan'?'selected':''}>Belum dikerjakan</option>
                        <option ${task.status==='Sedang dikerjakan'?'selected':''}>Sedang dikerjakan</option>
                        <option ${task.status==='Sudah dikumpulkan'?'selected':''}>Sudah dikumpulkan</option>
                        <option ${task.status==='Selesai'?'selected':''}>Selesai</option>
                        <option ${task.status==='Perlu revisi'?'selected':''}>Perlu revisi</option>
                    </select></div>
                    <div class="form-group"><label>Link Hasil Tugas (opsional)</label><input id="tResultLink" value="${escapeHtml(task.resultLink)}" placeholder="https://drive.google.com/..."></div>
                    <div class="form-group"><label>Catatan</label><textarea id="tNotes">${escapeHtml(task.notes)}</textarea></div>
                    <button type="submit" class="btn btn-primary mt-3"><i data-lucide="save"></i> Simpan</button>
                </form>
            </div>
        `;
        document.body.appendChild(modal);
        lucide.createIcons();
        modal.querySelector('#closeModal').addEventListener('click', () => modal.remove());
        modal.querySelector('#taskForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                title: document.getElementById('tTitle').value.trim(),
                category: document.getElementById('tCategory').value.trim(),
                modul: document.getElementById('tModul').value.trim(),
                desc: document.getElementById('tDesc').value.trim(),
                date: document.getElementById('tDate').value,
                status: document.getElementById('tStatus').value,
                result: task.result || '',
                notes: document.getElementById('tNotes').value.trim(),
                driveLink: task.driveLink || '',
                resultLink: document.getElementById('tResultLink').value.trim(),
                ket: task.ket || ''
            };
            if (isEdit) appData.tasks[editIdx] = newTask;
            else appData.tasks.push(newTask);
            saveData();
            modal.remove();
            showToast(isEdit ? 'Tugas diperbarui' : 'Tugas ditambahkan');
            renderPage('tasks');
        });
    }

    // ============ EXPORT CSV ============
    function exportCSV() {
        const tasks = appData.tasks;
        if (tasks.length === 0) { showToast('Tidak ada data tugas untuk diekspor', 'error'); return; }
        const headers = ['Judul', 'Kategori', 'Modul', 'Status', 'Tanggal', 'Deskripsi'];
        const rows = tasks.map(t => [t.title, t.category, t.modul, t.status, t.date, t.desc].map(v => `"${(v || '').replace(/"/g, '""')}"`).join(','));
        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ppg2026_khusnul_tasks.csv';
        a.click();
        URL.revokeObjectURL(url);
        showToast('CSV diunduh');
    }

        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        window.addEventListener('beforeunload', saveData);
    };
